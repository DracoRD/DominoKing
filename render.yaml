databases:
  - name: quisqueya-domino-db
    databaseName: quisqueya_domino
    user: quisqueya
    plan: free

services:
  - type: web
    name: quisqueya-domino
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.20.0
      - key: DATABASE_URL
        fromDatabase:
          name: quisqueya-domino-db
          property: connectionString
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: TX_ENCRYPTION_KEY
        generateValue: true
